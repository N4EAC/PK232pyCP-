# PK232PY — Continuous Integration
# Runs on every push and pull request to main.
# Checks: syntax, imports, unit tests on Python 3.10 / 3.11 / 3.12

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyserial pytest

      - name: Install package (editable)
        run: pip install -e .

      - name: Syntax check - all .py files
        run: |
          python -m compileall -q src/pk232py
          python -m compileall -q tools

      - name: Run unit tests
        run: pytest src/pk232py/tests/ -v --tb=short